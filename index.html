<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --border:#e1e4e9; --text:#151820; --muted:#5f6775;
  --accent:#2563eb; --accent-soft:#e8efff;
  --p1:#d92d20; --p2:#e46a0c; --p3:#2563eb; --p4:#8a94a3;
  --ok:#15803d; --warn:#b45309; --violet:#7c3aed;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --radius:12px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#161920; --surface-2:#1e222b; --border:#2a2f3a; --text:#e8eaef; --muted:#9aa2b1;
  --accent:#5b8cff; --accent-soft:#1b2747;
  --p1:#f87171; --p2:#fb923c; --p3:#60a5fa; --p4:#7d8696;
  --ok:#4ade80; --warn:#fbbf24; --violet:#a78bfa;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
option{background:var(--surface);color:var(--text)}
a{color:var(--accent)}
.muted{color:var(--muted)}
.spacer{flex:1}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--p1);border-color:color-mix(in srgb,var(--p1) 40%,transparent)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%;margin-top:10px;padding:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
.tabs{display:flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:10px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
:root[data-theme="dark"] .tab.active{background:var(--border)}
.tab .dot[hidden]{display:none}
.tab .dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;line-height:18px;margin-left:6px;text-align:center}
.who{display:flex;align-items:center;gap:8px;font-weight:500}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
.board-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.board-head h1{margin:0;font-size:24px;letter-spacing:-.02em}
.board-head p{margin:2px 0 0}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

.banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-weight:500}
.banner .btn{margin-left:auto}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;text-align:left}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{color:var(--muted);font-size:12.5px}
.stat.alert b{color:var(--p1)}
.stat.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

.quick{display:flex;gap:8px;margin-bottom:10px}
.quick input,.quick select,.filters input,.filters select{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
.quick #quickTitle{flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1 1 220px;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.search input{width:100%;padding-left:34px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0;border-color:var(--accent)}

/* groups & cards */
.group{margin-bottom:18px}
.group-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px 2px}
.group-head .count{background:var(--surface-2);border-radius:999px;padding:1px 8px;font-size:11.5px}
.group-head.overdue{color:var(--p1)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{--pc:var(--p3);display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--pc);border-radius:var(--radius);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:color-mix(in srgb,var(--pc) 55%,var(--border));border-left-color:var(--pc)}
.card.p1{--pc:var(--p1)}.card.p2{--pc:var(--p2)}.card.p3{--pc:var(--p3)}.card.p4{--pc:var(--p4)}
.card.is-new{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.card.is-done{opacity:.65}
.card.is-done .title{text-decoration:line-through}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:transparent;cursor:pointer;margin-top:1px;display:grid;place-items:center;color:#fff;padding:0}
.check:hover{border-color:var(--ok)}
.is-done .check{background:var(--ok);border-color:var(--ok)}
.card-body{flex:1;min-width:0}
.card-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:3px}
.pri{font-size:11.5px;font-weight:700;color:var(--pc);letter-spacing:.02em}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.new{background:var(--accent);color:#fff}
.title{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.notes{margin:3px 0 0;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:7px}
.meta span,.meta a{display:inline-flex;align-items:center;gap:4px}
.meta a{text-decoration:none;font-weight:500}
.meta .overdue{color:var(--p1);font-weight:600}
.meta .soon{color:var(--warn);font-weight:600}
.card-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.card-lead{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:34px}
.rank{--h:0;min-width:34px;height:24px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;background:hsl(var(--h) 85% 50% / .16);color:hsl(var(--h) 80% 34%)}
:root[data-theme="dark"] .rank{background:hsl(var(--h) 80% 55% / .2);color:hsl(var(--h) 85% 70%)}
.order-ctrl{display:flex;align-items:center;gap:2px}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.drag-handle{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.drag-handle:hover{background:var(--surface-2);color:var(--text)}
.card.dragging{opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.18);border-color:var(--accent);position:relative;z-index:5}
.card.dragging .drag-handle{cursor:grabbing}
.pick{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:grid;place-items:center;color:#fff}
.pick.on{background:var(--accent);border-color:var(--accent)}
.card.selecting{user-select:none}
.card.is-selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.list-tools{display:flex;align-items:center;gap:10px;margin:-6px 0 12px;font-size:13px;min-height:30px}
.list-tools .btn{margin-left:auto}
.bulkbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(680px,calc(100vw - 24px));display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:30;font-weight:600}
.bulkbar[hidden]{display:none}
.status-pill{--sc:var(--muted);appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.s-todo{--sc:var(--muted)}.s-doing{--sc:var(--accent)}.s-waiting{--sc:var(--warn)}.s-paused{--sc:var(--violet)}.s-done{--sc:var(--ok)}

.empty{text-align:center;padding:48px 16px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

/* suggestions */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.panel-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.panel-head h2{margin:0;font-size:16px}
.panel-head p{margin:2px 0 0;font-size:13px}
.sugg{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px}
.sugg-title{font-weight:600;margin:3px 0 2px;overflow-wrap:anywhere}
.sugg-from{font-size:12.5px;color:var(--muted)}
.sugg-snip{font-size:13px;color:var(--muted);margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.sugg-actions{display:flex;gap:6px;flex-wrap:wrap}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* dialog */
dialog{border:1px solid var(--border);border-radius:16px;padding:0;background:var(--surface);color:var(--text);width:min(620px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(8,10,15,.45)}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:18px}
.dlg-head{grid-column:1/-1;display:flex;align-items:center}
.dlg-head h2{margin:0;font-size:18px;flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:9px 11px;width:100%;resize:vertical}
.full{grid-column:1/-1}
.editor p{margin:0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg-opt{--pc:var(--p3);position:relative}
.seg-opt.pri1{--pc:var(--p1)}.seg-opt.pri2{--pc:var(--p2)}.seg-opt.pri4{--pc:var(--p4)}
.seg-opt input{position:absolute;opacity:0}
.seg-opt span{display:block;text-align:center;padding:8px 4px;border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg-opt input:checked+span{border-color:var(--pc);color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,transparent)}
.seg-opt input:focus-visible+span{outline:2px solid var(--accent)}
.audit{font-size:12.5px;color:var(--muted)}
.dlg-foot{grid-column:1/-1;display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);padding-top:14px;margin-top:2px}
.check-row{display:flex;align-items:center;gap:8px;font-size:14px}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.login-card .brand{font-size:22px;margin-bottom:6px}
.login-card .brand-mark{width:36px;height:36px;border-radius:10px}
.demo-note{font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:14px 0 4px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}

@media (max-width:720px){
  .tabs{order:3;width:100%}
  .tab{flex:1}
  .who-name{display:none}
  .board-head h1{font-size:21px}
  .head-actions{margin-left:0;width:100%}
  .head-actions .btn{flex:1;padding:8px 8px;font-size:13.5px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat.optional{display:none}
  .quick{flex-wrap:wrap}
  .quick #quickTitle{flex:1 1 100%}
  .quick select,.quick input[type=date]{flex:1}
  .filters select{flex:1 1 30%}
  .card{flex-wrap:wrap;padding:12px}
  .card-side{width:100%;padding-left:46px;flex-direction:row;align-items:center;justify-content:space-between}
  .bulkbar #bulkCount{width:100%}
  .bulkbar .spacer{display:none}
  .editor{grid-template-columns:1fr;padding:16px}
  .seg{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<script type="module">

const TEAM = {

  scannedCount: 0,

};

let store = null, fb = null, unsub = null;
const app = document.getElementById("app");

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const clean = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
function localGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function decodeEntities(s) { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; }

function fmtDate(s) {
  if (!s) return "";
  const d = parseYmd(s), diff = Math.round((d - parseYmd(today())) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff === -1) return "Yesterday";
  const opts = { month: "short", day: "numeric" };
  if (diff > 1 && diff < 7) opts.weekday = "short";
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString(undefined, opts);
}
function fmtTime(s) {
  if (!s) return "";
  const [h, m] = s.split(":").map(Number);
  return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? "AM" : "PM"}`;
}
function fmtStamp(ms) {
  if (!ms) return "";
  return new Date(ms).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
function normLink(s) {
  s = (s || "").trim();
  if (!s) return "";
  return /^https?:\/\//i.test(s) ? s : "https://" + s;
}
const personName = k => TEAM[k]?.name || k || "someone";
const personForEmail = e => Object.keys(TEAM).find(k => TEAM[k].emails.some(x => x.toLowerCase() === (e || "").trim().toLowerCase()));
const boardTitle = k => `${TEAM[k].name}'s ${TEAM[k].board}`;

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

/* ---------- icons ---------- */
const svg = (p, s = 14) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {

/* ---------- theme (saved per person) ---------- */
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function applyTheme(t) {
  localSet("radar-theme", t);
  const dark = t === "dark" || (t === "system" && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
darkQuery.addEventListener?.("change", () => applyTheme(state.prefs.theme || "system"));
function updateThemeBtn() {
  const b = $("#themeBtn"); if (!b) return;

  b.title = `Theme: ${t === "system" ? "match device" : t} (tap to change)`;
}
function cycleTheme() {
  const next = THEMES[(THEMES.indexOf(state.prefs.theme) + 1) % THEMES.length];
  state.prefs.theme = next;
  applyTheme(next); updateThemeBtn();
  store.setPrefs(state.me, { theme: next }).catch(() => {});
  toast(next === "system" ? "Theme: match device" : `Theme: ${next} mode`);
}

/* =====================================================================
   DATA STORES
   ===================================================================== */
function makeDemoStore() {
  let tickets = localGet("radar-demo-v2-tickets") || seedTickets();
  const prefs = localGet("radar-demo-prefs") || {};
  const subs = new Set();
  const emit = () => { localSet("radar-demo-v2-tickets", tickets); subs.forEach(f => f(tickets.slice())); };
  return {
    subscribe(cb) { subs.add(cb); cb(tickets.slice()); return () => subs.delete(cb); },
    async add(t) { tickets.push({ ...t, id: uid() }); emit(); },
    async addMany(list) { list.forEach(t => tickets.push({ ...t, id: uid() })); emit(); },
    async update(id, p) { tickets = tickets.map(t => t.id === id ? { ...t, ...p } : t); emit(); },
    async updateMany(ids, p) { tickets = tickets.map(t => ids.includes(t.id) ? { ...t, ...p } : t); emit(); },
    async remove(id) { tickets = tickets.filter(t => t.id !== id); emit(); },
    async removeMany(ids) { tickets = tickets.filter(t => !ids.includes(t.id)); emit(); },
    async getPrefs(k) { return prefs[k] || {}; },
    async setPrefs(k, p) { prefs[k] = { ...(prefs[k] || {}), ...p }; localSet("radar-demo-prefs", prefs); }
  };
}

async function makeFirebaseStore() {
  // Firebase Realtime Database: /tickets/{id} and /prefs/{person}
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [appM, authM, rt] = await Promise.all([
    import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-database.js")
  ]);
  const fbApp = appM.initializeApp(FIREBASE_CONFIG);
  const auth = authM.getAuth(fbApp);
  const db = rt.getDatabase(fbApp);
  const root = rt.ref(db);
  const ticketsRef = rt.ref(db, "tickets");
  const tRef = id => rt.ref(db, `tickets/${id}`);
  const newKey = () => rt.push(ticketsRef).key;
  const multi = paths => rt.update(root, paths);
  return {
    appM, authM, auth,
    store: {
      subscribe(cb, onErr) {
        return rt.onValue(ticketsRef, snap => {
          const v = snap.val() || {};
          cb(Object.entries(v).map(([id, t]) => ({ id, ...t })));
        }, onErr);
      },
      add: t => rt.set(tRef(newKey()), t),
      async addMany(list) {
        const paths = {};
        list.forEach(t => { paths[`tickets/${newKey()}`] = t; });
        await multi(paths);
      },
      update: (id, p) => rt.update(tRef(id), p),
      async updateMany(ids, p) {
        const paths = {};
        ids.forEach(id => Object.entries(p).forEach(([k, v]) => { paths[`tickets/${id}/${k}`] = v; }));
        await multi(paths);
      },
      remove: id => rt.remove(tRef(id)),
      async removeMany(ids) {
        const paths = {};
        ids.forEach(id => { paths[`tickets/${id}`] = null; });
        await multi(paths);
      },
      async getPrefs(k) {
        const s = await rt.get(rt.ref(db, `prefs/${k}`));
        const v = s.val() || {};
        if (v.dismissed && !Array.isArray(v.dismissed)) v.dismissed = Object.values(v.dismissed);
        return v;
      },
      setPrefs: (k, p) => rt.update(rt.ref(db, `prefs/${k}`), p)
    }
  };
}

/* =====================================================================
   BOARD RENDERING
   ===================================================================== */
const isOpen = t => t.status !== "done";
function dueBucket(t) {
  if (t.status === "done") return "done";
  if (!t.dueDate) return "none";
  const td = today();
  if (t.dueDate < td) return "overdue";
  if (t.dueDate === td) return "today";
  if (t.dueDate === ymd(addDays(new Date(), 1))) return "tomorrow";
  if (t.dueDate <= ymd(addDays(new Date(), 7))) return "week";
  return "later";
}
const byPriority = (a, b) => (a.priority - b.priority) || (a.dueDate || "9999").localeCompare(b.dueDate || "9999") || (a.dueTime || "99").localeCompare(b.dueTime || "99") || (rankOf(a) - rankOf(b));
const byDue = (a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999") || (a.priority - b.priority) || (a.dueTime || "99").localeCompare(b.dueTime || "99") || (rankOf(a) - rankOf(b));

const rankOf = t => typeof t.rank === "number" ? t.rank : 1e9 + (t.createdAt || 0) / 1e3;
const byRank = (a, b) => rankOf(a) - rankOf(b) || (a.createdAt - b.createdAt);
function boardTickets(board = state.board) { return state.tickets.filter(t => t.board === board); }
function nextRank(board) {
  const r = boardTickets(board).map(t => t.rank).filter(n => typeof n === "number");
  return r.length ? Math.floor(Math.max(...r)) + 1 : 1;
}
function computeRanks() {
  state.rankPos = new Map();
  boardTickets().filter(isOpen).sort(byRank).forEach((t, i) => state.rankPos.set(t.id, i + 1));
}
// Color for a rank position: #1 red, then orange, yellow, green, down to blue at the bottom
function rankHue(pos) {
  const n = state.rankPos.size;
  return n <= 1 ? 0 : Math.round(210 * (pos - 1) / (n - 1));
}

/* ---------- manual ordering ---------- */
function orderedOpen() { return visibleTickets().filter(isOpen).sort(byRank); }
async function placeAt(id, list, index) {
  // list = the open items in display order WITHOUT the moved item; index = where it goes
  const prev = list[index - 1], next = list[index];
  let rank;
  if (prev && next) rank = (rankOf(prev) + rankOf(next)) / 2;
  else if (prev) rank = rankOf(prev) + 1;
  else if (next) rank = rankOf(next) - 1;
  else rank = 1;
  const tooTight = prev && next && Math.abs(rankOf(next) - rankOf(prev)) < 1e-6;
  const t = state.tickets.find(x => x.id === id);
  if (tooTight || (prev && typeof prev.rank !== "number") || (next && typeof next.rank !== "number")) {
    // renumber everything cleanly 1..n
    const full = list.slice(); full.splice(index, 0, t);
    await Promise.all(full.map((x, i) => x.rank === i + 1 ? null : store.update(x.id, { rank: i + 1 }))).catch(e => toast(e.message));
    if (t) await patchTicket(t, { rank: index + 1 });
    return;
  }
  if (t) await patchTicket(t, { rank });
}
function moveBy(id, delta) {
  const list = orderedOpen();
  const i = list.findIndex(t => t.id === id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.splice(i, 1);
  placeAt(id, list, j);
}

// drag-to-reorder (mouse and touch) via the ⠿ handle
function startDrag(e) {
  const handle = e.target.closest(".drag-handle");
  if (!handle) return;
  e.preventDefault();
  const card = handle.closest(".card"), box = card.parentElement;
  state.dragging = true;
  card.classList.add("dragging");
  let scrollTimer = null, lastY = e.clientY;
  const reposition = y => {
    const others = [...box.querySelectorAll(".card:not(.dragging)")];
    const after = others.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
    box.insertBefore(card, after || null);
  };
  const autoScroll = () => {
    const edge = 70;
    if (lastY < edge) window.scrollBy(0, -12);
    else if (lastY > innerHeight - edge) window.scrollBy(0, 12);
    else return;
    reposition(lastY);
  };
  scrollTimer = setInterval(autoScroll, 16);
  const move = ev => { lastY = ev.clientY; reposition(ev.clientY); };
  const end = () => {
    clearInterval(scrollTimer);
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", end);
    window.removeEventListener("pointercancel", end);
    card.classList.remove("dragging");
    state.dragging = false;
    const ids = [...box.querySelectorAll(".card")].map(c => c.dataset.id);
    const id = card.dataset.id, index = ids.indexOf(id);
    const list = orderedOpen().filter(t => t.id !== id);
    const before = orderedOpen().map(t => t.id);
    if (before.indexOf(id) === index) { renderList(); return; }
    // keep only items that were in this container, in the new DOM order
    const byId = new Map(list.map(t => [t.id, t]));
    const newOrder = ids.filter(x => x !== id).map(x => byId.get(x)).filter(Boolean);
    placeAt(id, newOrder, index);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
}

/* ---------- select & combine ---------- */
function setSelectMode(on) {
  state.selectMode = on;
  state.selected.clear();
  $("#selectBtn").textContent = on ? "Done selecting" : "Select";
  updateBulkbar();
  renderBoard();
}
function updateBulkbar() {
  const bar = $("#bulkbar"); if (!bar) return;
  bar.hidden = !state.selectMode;
  const n = state.selected.size;
  $("#bulkCount").textContent = n ? `${n} selected` : "Tap items to select";
  $("#bulkMerge").disabled = n < 2;
  $("#bulkDone").disabled = !n;
  $("#bulkDelete").disabled = !n;
}
function openMerge(ids) {
  const items = ids.map(id => state.tickets.find(t => t.id === id)).filter(Boolean).sort(byRank);
  if (items.length < 2) return;
  const uniq = arr => [...new Set(arr.map(s => (s || "").trim()).filter(Boolean))];
  const dated = items.filter(t => t.dueDate).sort((a, b) => a.dueDate.localeCompare(b.dueDate) || (a.dueTime || "99").localeCompare(b.dueTime || "99"));
  const link = items.find(t => t.link)?.link || "";
  const lines = items.map(t => {
    let s = `• ${t.title}`;
    if (t.notes) s += ` (${t.notes.replace(/\s*\n\s*/g, "; ")})`;
    if (t.link && t.link !== link) s += ` ${t.link}`;
    return s;
  });
  const statuses = items.map(t => t.status);
  const preset = {
    title: items[0].title,
    notes: "Combined from:\n" + lines.join("\n"),
    link,
    priority: Math.min(...items.map(t => t.priority || 3)),
    dueDate: dated[0]?.dueDate || "",
    dueTime: dated[0]?.dueTime || "",
    jobNumber: uniq(items.map(t => t.jobNumber)).join(", "),
    estHours: uniq(items.map(t => t.estHours)).join(" + "),
    status: statuses.includes("doing") ? "doing" : statuses.every(s => s === statuses[0]) ? statuses[0] : "todo",
    board: items[0].board,
    rank: Math.min(...items.map(rankOf))
  };
  state.editorMerge = items.map(t => t.id);
  openEditor(null, preset);
}

function visibleTickets() {
  const q = state.search.trim().toLowerCase();
  return boardTickets().filter(t => {
    if (state.quickFilter) {
      const b = dueBucket(t);
      if (state.quickFilter === "overdue" && b !== "overdue") return false;
      if (state.quickFilter === "today" && b !== "today") return false;
      if (state.quickFilter === "p1" && !(isOpen(t) && t.priority === 1)) return false;
      if (state.quickFilter === "waiting" && t.status !== "waiting") return false;
      if (state.quickFilter === "open" && !isOpen(t)) return false;
    } else {
      if (state.fStatus === "open" && !isOpen(t)) return false;
      if (!["open", "all"].includes(state.fStatus) && t.status !== state.fStatus) return false;
      if (state.fPriority !== "all" && t.priority !== +state.fPriority) return false;
    }
    if (q && !`${t.title} ${t.notes} ${t.jobNumber}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderBoard() {
  if (!state.me || !$("#list")) return;
  const b = state.board, mine = b === state.me, owner = TEAM[b];
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.board === b);
    const n = state.tickets.filter(x => x.board === t.dataset.board && t.dataset.board === state.me && !x.seen && isOpen(x)).length;
    const dot = t.querySelector(".dot"); dot.hidden = !n; dot.textContent = n;
  });
  $("#boardTitle").textContent = mine ? `My ${owner.board}` : boardTitle(b);
  $("#boardSub").textContent = mine
    ? (b === "luke" ? "Everything on your plate, ranked." : "Your own schedule and to-dos.")
    : `${owner.fullName} · ${owner.title}`;
  $("#quickTitle").placeholder = mine ? "Quick add a task…" : `Add something to ${owner.name}'s radar…`;
  $("#emailBtn").hidden = !(mine && state.me === GMAIL_FOR);
  if (!mine) state.suggestions = null;

  // banner
  const bt = boardTickets();
  const unseen = bt.filter(t => !t.seen && isOpen(t));
  let banner = "";
  if (mine && unseen.length) {
    const who = [...new Set(unseen.map(t => personName(t.updatedBy || t.createdBy)))].join(" and ");
    banner = `<div class="banner"><span>${esc(who)} added or changed ${unseen.length} item${unseen.length > 1 ? "s" : ""} on your ${owner.board}.</span><button class="btn small" data-act="seenAll">Mark all seen</button></div>`;
  } else if (!mine) {
    const pending = unseen.filter(t => (t.updatedBy || t.createdBy) === state.me).length;
    if (pending) banner = `<div class="banner"><span>${pending} item${pending > 1 ? "s" : ""} you added or changed ${pending > 1 ? "haven't" : "hasn't"} been opened by ${esc(owner.name)} yet.</span></div>`;
  }
  $("#banner").innerHTML = banner;

  // stats
  const open = bt.filter(isOpen);
  const stat = (q, n, label, cls = "") => `<button class="stat ${cls} ${state.quickFilter === q ? "active" : ""}" data-q="${q}"><b>${n}</b><span>${label}</span></button>`;
  const overdue = open.filter(t => dueBucket(t) === "overdue").length;
  $("#stats").innerHTML =
    stat("open", open.length, "Open") +

    stat("p1", open.filter(t => t.priority === 1).length, "Critical", "optional") +
    stat("waiting", open.filter(t => t.status === "waiting").length, "Waiting", "optional");

  renderSuggestions();
  renderList();
}

function renderList() {
  if (state.dragging) return;
  computeRanks();
  const items = visibleTickets();
  const el = $("#list");
  const hint = $("#listHint");
  if (hint) hint.textContent = state.selectMode
    ? "Tap items to select them, then combine, finish, or delete."
    : state.view === "order" ? "Drag ⠿ or use the arrows to rank. #1 is the top of the list." : "";
  if (!items.length) {
    const any = boardTickets().length;
    const offerStarter = !any && state.board === "luke";
    el.innerHTML = `<div class="empty"><b>${any ? "Nothing matches" : "All clear"}</b>${any ? "Try a different filter or search." : `Nothing on ${state.board === state.me ? "your" : TEAM[state.board].name + "'s"} ${TEAM[state.board].board} yet. Use quick add above, or Import to bring in a spreadsheet.`}
      ${offerStarter ? `<div style="margin-top:14px"><button class="btn primary" id="starterBtn" type="button">Load Luke's current list (${STARTER_LIST.length} items)</button></div>` : ""}</div>`;

      catch (err) { toast("Couldn't load: " + err.message); e.target.disabled = false; }
    });
    return;
  }
  let groups;
  if (state.view === "order") {
    groups = [
      { key: "ranked", label: "Ranked", items: items.filter(isOpen).sort(byRank) },
      { key: "done", label: "Done", items: items.filter(t => !isOpen(t)).sort((a, b) => b.updatedAt - a.updatedAt) }
    ];
  } else if (state.view === "priority") {
    groups = [1, 2, 3, 4].map(p => ({ key: "p" + p, label: `${PRIORITIES[p].short} · ${PRIORITIES[p].label}`, items: items.filter(t => isOpen(t) && t.priority === p).sort(byDue) }));
    groups.push({ key: "done", label: "Done", items: items.filter(t => !isOpen(t)).sort((a, b) => b.updatedAt - a.updatedAt) });
  } else if (state.view === "job") {
    const jobs = [...new Set(items.map(t => t.jobNumber || ""))].sort((a, b) => (a === "") - (b === "") || a.localeCompare(b, undefined, { numeric: true }));
    groups = jobs.map(j => ({ key: "job", label: j ? `Job ${j}` : "No job #", items: items.filter(t => (t.jobNumber || "") === j).sort((a, b) => (!isOpen(a)) - (!isOpen(b)) || byPriority(a, b)) }));
  } else if (state.view === "status") {
    groups = STATUSES.map(s => ({ key: s.id, label: s.label, items: items.filter(t => t.status === s.id).sort(byPriority) }));
  } else {
    const L = { overdue: "Overdue", today: "Today", tomorrow: "Tomorrow", week: "Next 7 days", later: "Later", none: "No due date", done: "Done" };
    groups = Object.keys(L).map(k => ({ key: k, label: L[k], items: items.filter(t => dueBucket(t) === k).sort(k === "done" ? (a, b) => b.updatedAt - a.updatedAt : byPriority) }));
  }
  el.innerHTML = groups.filter(g => g.items.length).map(g => `
    <section class="group">

      <div class="cards">${g.items.map(cardHTML).join("")}</div>

}

function cardHTML(t) {
  const p = PRIORITIES[t.priority] || PRIORITIES[3];
  const bucket = dueBucket(t);
  const fromOther = t.createdBy && t.createdBy !== t.board;
  const isNew = !t.seen && t.board === state.me && isOpen(t);
  const changed = t.updatedBy && t.updatedBy !== t.createdBy;
  const dueCls = bucket === "overdue" ? "overdue" : bucket === "today" ? "soon" : "";
  const meta = [
    t.dueDate ? `<span class="${dueCls}">${svg(I.cal)}${esc(fmtDate(t.dueDate))}${t.dueTime ? " · " + esc(fmtTime(t.dueTime)) : ""}</span>` : (t.dueTime ? `<span>${svg(I.clock)}${esc(fmtTime(t.dueTime))}</span>` : ""),
    t.jobNumber ? `<span>${svg(I.job)}Job ${esc(t.jobNumber)}</span>` : "",
    t.estHours ? `<span>${svg(I.hours)}${esc(t.estHours)}</span>` : "",
    t.link ? `<a href="${esc(t.link)}" target="_blank" rel="noopener">${svg(t.source === "email" || /mail\.google/.test(t.link) ? I.mail : I.link)}${/mail\.google/.test(t.link) ? "Open email" : "Open link"}</a>` : ""
  ].filter(Boolean).join("");
  const pos = state.rankPos.get(t.id);
  const sel = state.selectMode, picked = state.selected.has(t.id);
  const ordering = state.view === "order" && isOpen(t) && !sel;
  const lead = sel
    ? `<span class="pick ${picked ? "on" : ""}" aria-hidden="true">${picked ? svg(I.check, 13) : ""}</span>`
    : `<button class="check" data-act="toggle" aria-label="${isOpen(t) ? "Mark done" : "Reopen"}" title="${isOpen(t) ? "Mark done" : "Reopen"}">${isOpen(t) ? "" : svg(I.check, 13)}</button>`;
  return `<article class="card p${t.priority} ${isOpen(t) ? "" : "is-done"} ${isNew ? "is-new" : ""} ${picked ? "is-selected" : ""} ${sel ? "selecting" : ""}" data-id="${esc(t.id)}">
    <div class="card-lead">
      ${pos ? `<span class="rank" style="--h:${rankHue(pos)}" title="Rank #${pos} of ${state.rankPos.size}">#${pos}</span>` : ""}
      ${lead}
    </div>
    <div class="card-body">
      <div class="card-top">
        <span class="pri">${p.short} · ${p.label}</span>
        ${isNew ? `<span class="tag new">${changed && !fromOther ? "Updated" : "New"}</span>` : ""}
        ${fromOther ? `<span class="tag">from ${esc(personName(t.createdBy))}</span>` : ""}
        ${t.source === "email" ? `<span class="tag">from email</span>` : ""}
      </div>
      <h3 class="title">${esc(t.title)}</h3>
      ${t.notes ? `<p class="notes">${esc(t.notes)}</p>` : ""}
      ${meta ? `<div class="meta">${meta}</div>` : ""}
    </div>
    <div class="card-side">
      <select class="status-pill s-${esc(t.status)}" data-act="status" data-id="${esc(t.id)}" aria-label="Status">
        ${STATUSES.map(s => `<option value="${s.id}" ${s.id === t.status ? "selected" : ""}>${s.label}</option>`).join("")}
      </select>
      ${ordering ? `<div class="order-ctrl">
        <button class="icon-btn sm" data-move="-1" aria-label="Move up" title="Move up">${svg(I.up, 16)}</button>
        <button class="icon-btn sm" data-move="1" aria-label="Move down" title="Move down">${svg(I.down, 16)}</button>
        <span class="drag-handle" title="Drag to reorder" aria-label="Drag to reorder">${svg(I.grip, 16)}</span>
      </div>` : ""}
    </div>
  </article>`;
}

   ===================================================================== */
function newTicket(d) {
  const now = Date.now();
  const board = d.board || state.board;
  return clean({
    title: (d.title || "").trim(),
    notes: d.notes || "",
    link: normLink(d.link),
    jobNumber: (d.jobNumber || "").trim(),
    dueDate: d.dueDate || "",
    dueTime: d.dueTime || "",
    priority: +d.priority || 3,
    status: d.status || "todo",
    estHours: (d.estHours || "").trim(),
    board,
    rank: typeof d.rank === "number" && isFinite(d.rank) ? d.rank : nextRank(board),
    createdBy: state.me,
    createdAt: now,
    updatedAt: now,
    updatedBy: state.me,
    seen: board === state.me,
    source: d.source || "manual",
    emailId: d.emailId || ""
  });
}
async function createTicket(d) {
  try { await store.add(newTicket(d)); }
  catch (e) { toast("Couldn't save: " + e.message); }
}
async function patchTicket(t, patch) {
  const board = patch.board || t.board;
  const p = clean({ ...patch, updatedAt: Date.now(), updatedBy: state.me, seen: board === state.me });
  try { await store.update(t.id, p); }
  catch (e) { toast("Couldn't save: " + e.message); }
}

/* =====================================================================
   SPREADSHEET IMPORT (paste from Excel/Sheets, or a CSV file)
   ===================================================================== */
function parseDelimited(text) {
  const first = text.split(/\r?\n/)[0] || "";
  const delim = first.includes("\t") ? "\t" : ",";
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"' && field === "") q = true;
    else if (c === delim) { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const tidy = s => (s || "").replace(/\uFFFC/g, "").replace(/\s+/g, " ").trim().replace(/^"+|"+$/g, "").trim();
function looseDate(s) {
  s = tidy(s); if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/);
  if (m) { let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000; return `${y}-${pad(m[1])}-${pad(m[2])}`; }
  const d = new Date(s);
  return isNaN(d) ? "" : ymd(d);
}
function looseTime(s) {
  s = tidy(s).toLowerCase(); if (!s) return "";
  const m = s.match(/^(\d{1,2})(?::(\d{2}))?\s*(a|p)?\.?m?\.?$/);
  if (!m) return "";
  let h = +m[1]; const min = +(m[2] || 0);
  if (m[3] === "p" && h < 12) h += 12;
  if (m[3] === "a" && h === 12) h = 0;
  return h < 24 && min < 60 ? `${pad(h)}:${pad(min)}` : "";
}
function looseStatus(s) {
  s = tidy(s).toLowerCase();
  if (!s) return "todo";
  if (s.includes("for the day") || s.includes("paused")) return "paused";
  if (/^(done|complete|completed|closed|finished)/.test(s)) return "done";
  if (s.includes("progress") || s.includes("started") || s.includes("working")) return "doing";
  if (s.includes("wait") || s.includes("hold") || s.includes("pending") || s.includes("blocked")) return "waiting";
  return "todo";
}
function loosePriority(s, fallback) {
  s = tidy(s).toLowerCase();
  if (/^(p?1|critical|urgent|asap)$/.test(s)) return 1;
  if (/^(p?2|high)$/.test(s)) return 2;
  if (/^(p?3|normal|medium|med)$/.test(s)) return 3;
  if (/^(p?4|low)$/.test(s)) return 4;
  return fallback;
}
function rowsToTickets(rows, board, defPri, skipDone) {
  const head = rows[0].map(h => tidy(h).toLowerCase());
  const col = (...names) => head.findIndex(h => names.includes(h));
  const ix = {
    title: col("description", "task", "title", "item", "to do", "todo"),
    notes: col("notes", "note", "comments"),
    date: col("due date", "due", "date"),
    time: col("due time", "time"),
    job: col("job #", "job", "job number", "job no", "job no.", "project #"),
    hrs: col("total job time", "job time", "hours", "est. time", "time estimate"),
    status: col("status"),
    pri: col("priority", "pri"),
    order: col("order", "rank", "#", "no.", "no")
  };
  const start = nextRank(board);
  const DUR = /^\d+(\.\d+)?\s*(m|min|mins|minutes?|h|hr|hrs|hours?)\b[\s\d|a-z.]*$/i;
  if (ix.title < 0) throw new Error("Couldn't find a Description column. Make sure the header row is included.");
  const get = (r, i) => i >= 0 ? (r[i] || "") : "";
  const out = [];
  for (const r of rows.slice(1)) {
    const title = tidy(get(r, ix.title));
    if (!title) continue;
    let notes = (get(r, ix.notes) || "").replace(/\uFFFC/g, "").trim();
    let link = "";
    const url = notes.match(/https?:\/\/\S+/);
    if (url) { link = url[0]; notes = notes.replace(url[0], "").trim(); }
    const status = looseStatus(get(r, ix.status));
    if (skipDone && status === "done") continue;
    let estHours = tidy(get(r, ix.hrs)), jobNumber = tidy(get(r, ix.job));
    // time estimates typed into the Notes or Job # columns
    if (DUR.test(notes)) { if (!estHours) estHours = notes.split("|")[0].trim(); notes = ""; }
    if (DUR.test(jobNumber)) { if (!estHours) estHours = jobNumber; jobNumber = ""; }
    const ord = parseFloat(tidy(get(r, ix.order)));
    out.push(newTicket({
      title, notes, link, board, status, estHours, jobNumber,
      dueDate: looseDate(get(r, ix.date)),
      dueTime: looseTime(get(r, ix.time)),
      priority: loosePriority(get(r, ix.pri), defPri),
      rank: start + (isFinite(ord) ? ord : out.length + 1) / 1000,
      source: "import"
    }));
  }
  return out;
}

function openImport() {
  const dlg = $("#dlg");
  dlg.innerHTML = `<form class="editor" id="impForm">
    <div class="dlg-head"><h2>Import from spreadsheet</h2><button type="button" class="icon-btn" data-close aria-label="Close">${svg(I.x, 18)}</button></div>
    <p class="muted full" style="font-size:14px">Copy your rows from Excel or Google Sheets, <b>including the header row</b>, and paste them here. Description, Notes, Due Date, Due Time, Job #, Total Job Time, Status and Priority columns are matched automatically; others are ignored.</p>
    <label class="field full"><span>Paste rows</span><textarea id="impText" rows="7" placeholder="Order&#9;Due Date&#9;Due Time&#9;Description&#9;Notes&#9;Job #&#9;Total Job Time&#9;Status"></textarea></label>
    <label class="field full"><span>Or choose a .csv file</span><input type="file" id="impFile" accept=".csv,.tsv,.txt,text/csv"></label>
    <label class="field"><span>Add to</span><select id="impBoard">${Object.keys(TEAM).map(k => `<option value="${k}" ${k === state.board ? "selected" : ""}>${esc(boardTitle(k))}</option>`).join("")}</select></label>
    <label class="field"><span>Priority when not given</span><select id="impPri">${[1, 2, 3, 4].map(n => `<option value="${n}" ${n === 3 ? "selected" : ""}>${PRIORITIES[n].short} ${PRIORITIES[n].label}</option>`).join("")}</select></label>
    <label class="check-row full"><input type="checkbox" id="impSkip" checked> Skip rows already marked Done</label>
    <p id="impPreview" class="muted full" style="font-size:13.5px"></p>
    <div class="dlg-foot"><div class="spacer"></div><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit" id="impGo" disabled>Import</button></div>
  </form>`;
  dlg.querySelectorAll("[data-close]").forEach(b => b.onclick = () => dlg.close());
  let parsed = [];
  const preview = () => {
    const text = $("#impText", dlg).value;
    const go = $("#impGo", dlg), pv = $("#impPreview", dlg);
    parsed = [];
    if (!text.trim()) { pv.textContent = ""; go.disabled = true; return; }
    try {
      const rows = parseDelimited(text);
      if (rows.length < 2) throw new Error("Need a header row plus at least one item.");
      parsed = rowsToTickets(rows, $("#impBoard", dlg).value, +$("#impPri", dlg).value, $("#impSkip", dlg).checked);
      pv.innerHTML = parsed.length
        ? `Ready to import <b>${parsed.length}</b> item${parsed.length > 1 ? "s" : ""}. First one: “${esc(parsed[0].title.slice(0, 80))}”`
        : "No items found to import.";
      go.disabled = !parsed.length;
      go.textContent = parsed.length ? `Import ${parsed.length}` : "Import";
    } catch (e) { pv.textContent = e.message; go.disabled = true; }
  };
  ["input", "change"].forEach(ev => dlg.querySelector("#impForm").addEventListener(ev, e => { if (e.target.id !== "impFile") preview(); }));
  $("#impFile", dlg).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    $("#impText", dlg).value = await f.text(); preview();
  };
  $("#impForm", dlg).onsubmit = async e => {
    e.preventDefault();
    if (!parsed.length) return;
    try {
      await store.addMany(parsed);
      dlg.close(); toast(`Imported ${parsed.length} item${parsed.length > 1 ? "s" : ""}`);
    } catch (err) { toast("Import failed: " + err.message); }
  };
  dlg.showModal();
}

   Reads recent inbox emails (read-only, in your browser; nothing is
   stored except the items you choose to add) and flags likely to-dos.

let gmailToken = null, gmailTokenAt = 0, gmailAuth = null;
// Gmail access uses a separate sign-in that never changes who is signed in to Radar,
// so this works whether Luke is signed in with his Gmail or his Sunbelt account.
async function getGmailToken() {
  if (gmailToken && Date.now() - gmailTokenAt < 50 * 60 * 1000) return gmailToken;
  const { authM, appM } = fb;
  if (!gmailAuth) gmailAuth = authM.getAuth(appM.initializeApp(FIREBASE_CONFIG, "gmail"));
  const provider = new authM.GoogleAuthProvider();
  provider.addScope("https://www.googleapis.com/auth/gmail.readonly");
  provider.setCustomParameters({ login_hint: GMAIL_ACCOUNT, hd: GMAIL_ACCOUNT.split("@")[1] });
  const res = await authM.signInWithPopup(gmailAuth, provider);
  if ((res.user.email || "").toLowerCase() !== GMAIL_ACCOUNT) {
    await authM.signOut(gmailAuth);
    throw new Error(`choose ${GMAIL_ACCOUNT} in the Google window`);
  }
  const cred = authM.GoogleAuthProvider.credentialFromResult(res);
  if (!cred?.accessToken) throw new Error("Google didn't return Gmail access.");
  gmailToken = cred.accessToken; gmailTokenAt = Date.now();
  return gmailToken;
}
async function gmailGet(path, token) {
  const r = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/" + path, { headers: { Authorization: `Bearer ${token}` } });
  const j = await r.json();
  if (!r.ok) { if (r.status === 401) gmailToken = null; throw new Error(j.error?.message || `Gmail error ${r.status}`); }
  return j;
}
async function fetchGmail() {
  const token = await getGmailToken();
  const list = await gmailGet(`messages?maxResults=30&q=${encodeURIComponent(GMAIL_QUERY)}`, token);
  const ids = (list.messages || []).map(m => m.id);
  const msgs = await Promise.all(ids.map(id =>
    gmailGet(`messages/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`, token).catch(() => null)));
  return msgs.filter(Boolean).map(m => {
    const h = n => (m.payload?.headers || []).find(x => x.name.toLowerCase() === n)?.value || "";
    return { id: m.id, threadId: m.threadId, subject: h("subject"), from: h("from"), date: new Date(+m.internalDate || h("date")), snippet: decodeEntities(m.snippet || ""), labels: m.labelIds || [] };
  });
}

const ACTION_WORDS = ["please", "can you", "could you", "would you", "need", "needs", "needed", "request", "send", "submit", "update", "revise", "review", "approve", "confirm", "order", "schedule", "follow up", "rfi", "submittal", "quote", "pricing", "let me know", "action required", "asap", "urgent", "deadline", "due", "eod", "end of day", "tomorrow", "today", "by friday", "by monday"];
const ACTION_RE = ACTION_WORDS.map(w => [w, new RegExp(`\\b${w.replace(/ /g, "\\s+")}\\b`, "i")]);
const URGENT_RE = /\b(asap|urgent|immediately|critical|today|eod|end of (the )?day|action required)\b/i;
const HIGH_RE = /\b(tomorrow|deadline|due|by (mon|tue|wed|thu|fri)[a-z]*)\b/i;
const SKIP_SENDER = /no-?reply|donotreply|notification|newsletter|mailer-daemon|marketing|digest|calendar-notification/i;

function parseDue(text) {
  const now = new Date();
  if (/\b(asap|today|eod|end of (the )?day|this afternoon|tonight)\b/i.test(text)) return ymd(now);
  if (/\btomorrow\b/i.test(text)) return ymd(addDays(now, 1));
  const days = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  const w = text.match(/\b(?:by|on|before|due|this|next)\s+(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i);
  if (w) {
    let diff = (days.indexOf(w[1].toLowerCase()) - now.getDay() + 7) % 7;
    if (diff === 0) diff = 7;
    return ymd(addDays(now, diff));
  }
  const d = text.match(/\b(?:by|on|before|due)\s+(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/i);
  if (d) {
    let y = d[3] ? +d[3] : now.getFullYear(); if (y < 100) y += 2000;
    const dt = new Date(y, +d[1] - 1, +d[2]);
    if (!isNaN(dt) && dt.getMonth() === +d[1] - 1) return ymd(dt);
  }
  return "";
}
function stampForTitle(date) {
  const h = date.getHours(), m = date.getMinutes();
  return `${date.getMonth() + 1}-${date.getDate()}-${String(date.getFullYear()).slice(2)} ${((h + 11) % 12) + 1}${m ? ":" + pad(m) : ""}${h < 12 ? "am" : "pm"}`;
}
function analyzeEmail(m) {
  const fromEmail = (m.from.match(/<([^>]+)>/)?.[1] || m.from).trim().toLowerCase();
  if (SKIP_SENDER.test(fromEmail)) return null;
  if (personForEmail(fromEmail) === state.me) return null;
  const text = `${m.subject} ${m.snippet}`;
  const hits = ACTION_RE.filter(([, re]) => re.test(text)).map(([w]) => w);
  let score = hits.length * 2;
  if (m.labels.includes("IMPORTANT")) score += 1;
  if (m.labels.includes("UNREAD")) score += 1;
  if (text.includes("?")) score += 1;
  const fromKey = personForEmail(fromEmail);
  if (fromKey) score += 3;
  if (score < 4) return null;

  let priority = URGENT_RE.test(text) ? 1 : HIGH_RE.test(text) ? 2 : 3;
  if (fromKey) priority = Math.min(priority, 2);
  const dueDate = parseDue(text);
  const job = text.match(/\b(?:job|project|proj)\s*(?:no\.?|number|#)?\s*:?\s*#?\s*([A-Z]{0,3}\d[\dA-Z-]{2,})/i)?.[1] || "";
  const fromName = (m.from.replace(/<[^>]*>/, "").replace(/"/g, "").trim() || fromEmail);
  const first = fromName.split(/[\s@]/)[0];
  const subject = m.subject.replace(/^((re|fw|fwd)\s*:\s*)+/i, "").trim() || m.snippet.slice(0, 70);

  const reasons = [];
  if (fromKey) reasons.push(`from ${TEAM[fromKey].name}`);
  if (dueDate) reasons.push(`due ${fmtDate(dueDate).toLowerCase()}`);
  if (priority === 1) reasons.push("sounds urgent");
  hits.filter(h => !/asap|urgent|today|tomorrow|eod|end of day|due|deadline/.test(h)).slice(0, 3).forEach(h => reasons.push(`“${h}”`));

  return {
    emailId: m.id, score, priority, dueDate, jobNumber: job, reasons,
    title: `${subject} (email from ${first} ${stampForTitle(m.date)})`,
    notes: m.snippet,
    link: m.threadId.startsWith("demo") ? "https://mail.google.com/mail/u/0/#inbox" : `https://mail.google.com/mail/u/0/#all/${m.threadId}`,
    from: fromName, date: m.date, snippet: m.snippet, source: "email"
  };
}

async function scanEmail() {
  if (state.scanning) return;
  state.scanning = true; state.suggestions = state.suggestions || []; renderSuggestions();
  try {
    const msgs = DEMO ? demoEmails() : await fetchGmail();
    state.scannedCount = msgs.length;
    state.suggestions = msgs.map(analyzeEmail).filter(Boolean).sort((a, b) => a.priority - b.priority || b.score - a.score);
  } catch (e) {
    const msg = e.code === "auth/popup-closed-by-user" ? "Gmail access was cancelled." : "Couldn't read Gmail: " + e.message;
    toast(msg);
    if (!state.suggestions?.length) state.suggestions = null;
  }
  state.scanning = false;
  renderSuggestions();
}

function renderSuggestions() {
  const el = $("#suggestions"); if (!el) return;
  if (state.board !== state.me || state.me !== GMAIL_FOR || state.suggestions === null) { el.innerHTML = ""; return; }
  if (state.scanning) {
    el.innerHTML = `<div class="panel"><span class="spinner"></span>Reading your recent inbox…</div>`;
    return;
  }
  const known = new Set(state.tickets.map(t => t.emailId).filter(Boolean));
  const dismissed = new Set(state.prefs.dismissed || []);
  const list = state.suggestions.filter(s => !known.has(s.emailId) && !dismissed.has(s.emailId));
  el.innerHTML = `<div class="panel">
    <div class="panel-head"><div><h2>Suggested from your inbox</h2>
      <p class="muted">Checked ${state.scannedCount} recent email${state.scannedCount === 1 ? "" : "s"} · ${list.length ? `${list.length} look${list.length === 1 ? "s" : ""} like action items` : "nothing new needs adding"}</p></div>
      <div class="spacer"></div>
      <button class="btn small" data-s="rescan">Rescan</button>
      <button class="icon-btn" data-s="close" aria-label="Close suggestions">${svg(I.x, 18)}</button></div>
    ${list.map(s => `<div class="sugg" data-email="${esc(s.emailId)}">
      <span class="pri" style="color:var(--p${s.priority})">${PRIORITIES[s.priority].short} · ${PRIORITIES[s.priority].label}</span>
      <div class="sugg-title">${esc(s.title)}</div>
      <div class="sugg-from">${esc(s.from)} · ${esc(s.date.toLocaleString(undefined, { weekday: "short", hour: "numeric", minute: "2-digit" }))}</div>
      <div class="sugg-snip">${esc(s.snippet)}</div>
      ${s.reasons.length ? `<div class="chips">${s.reasons.map(r => `<span class="chip">${esc(r)}</span>`).join("")}</div>` : ""}
      <div class="sugg-actions">
        <button class="btn primary small" data-s="add">Add to my list</button>
        <button class="btn small" data-s="edit">Edit first</button>
        <button class="btn small" data-s="dismiss">Dismiss</button>
        <a class="btn small" href="${esc(s.link)}" target="_blank" rel="noopener">Open email</a>
      </div></div>`).join("")}
  </div>`;
  el.onclick = async e => {
    const b = e.target.closest("[data-s]"); if (!b) return;
    const act = b.dataset.s;
    if (act === "close") { state.suggestions = null; renderSuggestions(); return; }
    if (act === "rescan") { scanEmail(); return; }
    const id = b.closest("[data-email]")?.dataset.email;
    const s = state.suggestions.find(x => x.emailId === id); if (!s) return;
    const data = { title: s.title, notes: s.notes, link: s.link, priority: s.priority, dueDate: s.dueDate, jobNumber: s.jobNumber, source: "email", emailId: s.emailId, board: state.me };
    if (act === "add") { await createTicket(data); toast("Added to your list"); }
    if (act === "edit") openEditor(null, data);
    if (act === "dismiss") {
      state.prefs.dismissed = [...(state.prefs.dismissed || []), id].slice(-300);
      store.setPrefs(state.me, { dismissed: state.prefs.dismissed }).catch(() => {});
      renderSuggestions();
    }
  };
}
